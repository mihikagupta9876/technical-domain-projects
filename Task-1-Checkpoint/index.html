<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkpoint — Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  :root{
    --ink:#0E1228;
    --ink-2:#161B3B;
    --ink-3:#232A52;
    --line:#2E3568;
    --paper:#F1F2FA;
    --muted:#9AA1C7;
    --muted-2:#6B72A0;
    --amber:#F5A623;
    --amber-ink:#241705;
    --green:#3ED9A0;
    --coral:#FF6B5B;
    --radius-sharp:3px;
    --radius-pill:999px;
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #root{min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--amber);color:var(--amber-ink);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;}

  /* ---------- header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--ink-2), var(--ink));
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;flex:none;}
  .brand-name{font-weight:700;font-size:17px;letter-spacing:-0.01em;}
  .brand-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);letter-spacing:.04em;}
  .role-toggle{display:flex;background:var(--ink-3);border:1px solid var(--line);border-radius:var(--radius-pill);padding:3px;gap:2px;}
  .role-toggle button{
    border:none;background:transparent;color:var(--muted);
    padding:7px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;
    transition:background .18s ease, color .18s ease;
  }
  .role-toggle button.active{background:var(--amber);color:var(--amber-ink);}

  /* ---------- shell ---------- */
  .shell{flex:1;display:flex;width:100%;max-width:1180px;margin:0 auto;align-self:center;}
  .main{flex:1;padding:28px 24px 60px;min-width:0;}

  /* ---------- hero (home) ---------- */
  .hero{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;
    padding:48px 8px 20px;
  }
  @media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:16px;}}
  .hero h1{
    font-size:clamp(32px,5vw,50px);line-height:1.04;letter-spacing:-0.015em;margin:0 0 16px;font-weight:700;
  }
  .hero p{color:var(--muted);font-size:16px;line-height:1.6;max-width:46ch;margin:0 0 26px;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--line);background:var(--ink-3);color:var(--paper);
    padding:12px 20px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, border-color .12s ease;
  }
  .btn:hover{border-color:var(--muted-2);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);}
  .btn-primary:hover{border-color:var(--amber);filter:brightness(1.06);}
  .btn-ghost{background:transparent;}
  .btn-block{width:100%;justify-content:center;}
  .btn-sm{padding:8px 14px;font-size:12.5px;}
  .btn[disabled]{opacity:.45;pointer-events:none;}

  .radar{
    position:relative;width:100%;aspect-ratio:1/1;max-width:340px;justify-self:center;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, var(--ink-3) 0%, var(--ink-2) 60%, var(--ink) 100%);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .radar::before,.radar::after{
    content:'';position:absolute;border:1px solid var(--line);border-radius:50%;
  }
  .radar::before{inset:16%;}
  .radar::after{inset:34%;}
  .radar-ring-inner{position:absolute;inset:52%;border:1px solid var(--line);border-radius:50%;}
  .radar-sweep{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, rgba(245,166,35,0) 0deg, rgba(245,166,35,.55) 18deg, rgba(245,166,35,0) 40deg);
    animation:spin 3.4s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .radar-dot{position:absolute;width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 0 5px rgba(62,217,160,.18);}
  .radar-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;color:var(--amber);}
  @media (prefers-reduced-motion:reduce){.radar-sweep{animation:none;}}

  /* ---------- cards / sections ---------- */
  .panel{
    background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-sharp);
    padding:22px;
  }
  .panel + .panel{margin-top:16px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .section-head h2{font-size:15px;margin:0;font-weight:600;}
  .section-head .hint{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input, .field select{
    width:100%;background:var(--ink);border:1px solid var(--line);color:var(--paper);
    padding:11px 12px;border-radius:var(--radius-sharp);font-size:14px;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .field-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);margin-top:5px;}

  /* ---------- events list ---------- */
  .event-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-sharp);
    margin-bottom:10px;background:var(--ink);
    transition:border-color .15s ease;
  }
  .event-row:hover{border-color:var(--muted-2);}
  .event-row button.rowbtn{all:unset;cursor:pointer;flex:1;min-width:0;}
  .event-name{font-weight:600;font-size:14.5px;margin-bottom:3px;}
  .event-meta{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);}
  .event-code{font-family:var(--font-mono);background:var(--ink-3);border:1px solid var(--line);padding:4px 9px;border-radius:var(--radius-sharp);font-size:12px;letter-spacing:.06em;}

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius-sharp);
    padding:34px 20px;text-align:center;color:var(--muted-2);font-size:13px;
  }

  /* ---------- event dashboard ---------- */
  .event-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .event-title{font-size:24px;font-weight:700;letter-spacing:-0.01em;margin:0 0 6px;}
  .event-sub{font-family:var(--font-mono);font-size:12px;color:var(--muted-2);}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  @media (max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-sharp);padding:16px;}
  .stat .num{font-size:26px;font-weight:700;font-family:var(--font-mono);}
  .stat .lbl{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .stat.accent .num{color:var(--amber);}
  .stat.good .num{color:var(--green);}

  .two-col{display:grid;grid-template-columns:1.3fr .9fr;gap:16px;}
  @media (max-width:900px){.two-col{grid-template-columns:1fr;}}

  .feed-item{
    display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
  }
  .feed-item:last-child{border-bottom:none;}
  .badge{width:9px;height:9px;border-radius:50%;flex:none;}
  .badge.ok{background:var(--green);box-shadow:0 0 0 3px rgba(62,217,160,.15);}
  .badge.bad{background:var(--coral);box-shadow:0 0 0 3px rgba(255,107,91,.15);}
  .feed-main{flex:1;min-width:0;}
  .feed-name{font-size:13.5px;font-weight:600;}
  .feed-detail{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);margin-top:2px;}
  .feed-time{font-family:var(--font-mono);font-size:11px;color:var(--muted);flex:none;}

  .bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:10px;}
  .bar{flex:1;background:linear-gradient(180deg,var(--amber),rgba(245,166,35,.25));border-radius:2px 2px 0 0;min-height:3px;}
  .bars-labels{display:flex;gap:5px;margin-top:6px;}
  .bars-labels span{flex:1;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--muted-2);}

  .qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0;}
  .qr-frame{background:#fff;padding:12px;border-radius:var(--radius-sharp);}
  .code-big{font-family:var(--font-mono);font-size:20px;letter-spacing:.15em;font-weight:600;color:var(--amber);}

  /* ---------- attendee flow ---------- */
  .flow{max-width:480px;margin:0 auto;}
  .flow-steps{display:flex;gap:6px;margin-bottom:22px;}
  .flow-steps span{flex:1;height:3px;background:var(--line);border-radius:2px;}
  .flow-steps span.done{background:var(--amber);}
  .keypad-code{
    font-family:var(--font-mono);font-size:28px;letter-spacing:.35em;text-align:center;
    width:100%;background:var(--ink);border:1px solid var(--line);color:var(--paper);
    padding:16px 10px 16px 20px;border-radius:var(--radius-sharp);text-transform:uppercase;
  }
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted-2);font-size:11px;margin:16px 0;font-family:var(--font-mono);}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}

  .scan-modal{
    position:fixed;inset:0;background:rgba(4,6,18,.86);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .scan-card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-sharp);padding:18px;width:100%;max-width:400px;}
  .scan-video-wrap{position:relative;border-radius:var(--radius-sharp);overflow:hidden;background:#000;aspect-ratio:1/1;}
  .scan-video-wrap video{width:100%;height:100%;object-fit:cover;}
  .scan-frame{position:absolute;inset:14%;border:2px solid var(--amber);border-radius:var(--radius-sharp);}
  .scan-hint{text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:12px;}

  .status-hero{text-align:center;padding:26px 10px 10px;}
  .status-icon{width:70px;height:70px;margin:0 auto 18px;}
  .status-hero h2{font-size:22px;margin:0 0 8px;}
  .status-hero p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 auto 20px;max-width:36ch;}
  .distance-pill{
    display:inline-flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);
    padding:8px 16px;border-radius:var(--radius-pill);font-family:var(--font-mono);font-size:12.5px;margin-bottom:18px;
  }

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink-3);border:1px solid var(--line);color:var(--paper);
    padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }

  .footnote{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);text-align:center;margin-top:24px;line-height:1.6;}
  .spin-ring{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:sr .8s linear infinite;margin:0 auto;}
  @keyframes sr{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =========================================================
   Checkpoint — QR + geolocation attendance system
   Single-file HTML artifact. Data persisted via window.storage
   (shared=true so organizers and attendees see the same events).
   ========================================================= */

const APP_PREFIX = "CHECKPOINT:";
const state = {
  role: null,           // 'organizer' | 'attendee'
  events: [],           // list of event summaries
  selectedEventId: null,
  attendance: [],        // records for selected event
  attFlow: { step: 'code', code: '', eventPreview: null, name: '', studentId: '', error: '' },
  toast: null,
  scanning: false,
};

let pollTimer = null;

// ---------------- storage helpers ----------------
async function sGet(key, shared){
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : null;
  } catch(e) {
    console.error('Storage read error:', e);
    return null;
  }
}
async function sSet(key, value, shared){
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch(e) {
    console.error('Storage write error:', e);
    return false;
  }
}

function genCode(len=6){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous chars
  let out = "";
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<5) return 'just now';
  if(s<60) return s+'s ago';
  const m = Math.floor(s/60); if(m<60) return m+'m ago';
  const h = Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

// ---------------- data operations ----------------
async function loadEventsIndex(){
  const idx = await sGet('events-index', true) || [];
  const events = [];
  for(const id of idx){
    const ev = await sGet('event:'+id, true);
    if(ev) events.push(ev);
  }
  events.sort((a,b)=> b.createdAt - a.createdAt);
  state.events = events;
}

async function createEvent(data){
  const id = genId();
  const code = genCode();
  const ev = {
    id, code,
    name: data.name, org: data.org, venue: data.venue,
    date: data.date, time: data.time,
    lat: data.lat, lng: data.lng, radius: data.radius,
    createdAt: Date.now(),
  };
  await sSet('event:'+id, ev, true);
  await sSet('attendance:'+id, [], true);
  const idx = await sGet('events-index', true) || [];
  idx.push(id);
  await sSet('events-index', idx, true);
  await loadEventsIndex();
  return ev;
}

async function loadAttendance(eventId){
  state.attendance = await sGet('attendance:'+eventId, true) || [];
}

async function addAttendanceRecord(eventId, rec){
  const list = await sGet('attendance:'+eventId, true) || [];
  list.push(rec);
  await sSet('attendance:'+eventId, list, true);
  return list;
}

async function findEventByCode(code){
  await loadEventsIndex();
  return state.events.find(e => e.code.toUpperCase() === code.toUpperCase()) || null;
}

// ---------------- icons (inline svg, stroke-based) ----------------
const ICON = {
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s7-7.2 7-12a7 7 0 10-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 9l6 6M15 9l-6 6"/></svg>`,
  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8.5A1.5 1.5 0 015.5 7H8l1-2h6l1 2h2.5A1.5 1.5 0 0120 8.5v9A1.5 1.5 0 0118.5 19h-13A1.5 1.5 0 014 17.5v-9z"/><circle cx="12" cy="13" r="3.4"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
  arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`,
};

// ---------------- render root ----------------
function render(){
  const root = document.getElementById('root');
  root.innerHTML = `
    ${renderTopbar()}
    <div class="shell"><div class="main">${renderMain()}</div></div>
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
    ${state.scanning ? renderScanModal() : ''}
  `;
  wireEvents();
  if(state.scanning) startCamera();
}

function renderTopbar(){
  return `
    <div class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="1.7">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.9" fill="#F5A623"/>
        </svg>
        <div>
          <div class="brand-name">Checkpoint</div>
          <div class="brand-tag">QR · GEO-VERIFIED ATTENDANCE</div>
        </div>
      </div>
      ${state.role ? `
      <div class="role-toggle">
        <button data-act="role" data-role="organizer" class="${state.role==='organizer'?'active':''}">Organizer</button>
        <button data-act="role" data-role="attendee" class="${state.role==='attendee'?'active':''}">Attendee</button>
      </div>` : ''}
    </div>
  `;
}

function renderMain(){
  if(!state.role) return renderHome();
  if(state.role==='organizer') return renderOrganizer();
  return renderAttendee();
}

// ---------------- HOME ----------------
function renderHome(){
  return `
  <div class="hero">
    <div>
      <h1>Every checkpoint,<br>verified on the spot.</h1>
      <p>Create an event, share a QR code, and watch attendance confirm itself — each check-in is matched against the attendee's live location before it counts.</p>
      <div class="hero-actions">
        <button class="btn btn-primary" data-act="role" data-role="organizer">${ICON.pin} Run an event</button>
        <button class="btn btn-ghost" data-act="role" data-role="attendee">${ICON.camera} Check in to an event</button>
      </div>
    </div>
    <div class="radar">
      <div class="radar-sweep"></div>
      <div class="radar-ring-inner"></div>
      <div class="radar-dot" style="left:30%;top:62%;"></div>
      <div class="radar-dot" style="left:68%;top:38%;background:#F5A623;box-shadow:0 0 0 5px rgba(245,166,35,.18);"></div>
      <div class="radar-pin">${ICON.pin}</div>
    </div>
  </div>
  <div class="footnote">Attendance data in this demo is stored in shared session storage — anyone using this artifact can see events and check-ins created here.</div>
  `;
}

// ---------------- ORGANIZER ----------------
function renderOrganizer(){
  if(state.selectedEventId){
    const ev = state.events.find(e=>e.id===state.selectedEventId);
    if(ev) return renderEventDashboard(ev);
  }
  return `
    <div class="section-head"><h2>Your events</h2><span class="hint">${state.events.length} total</span></div>
    ${state.events.length ? state.events.map(ev=>`
      <div class="event-row">
        <button class="rowbtn" data-act="open-event" data-id="${ev.id}">
          <div class="event-name">${esc(ev.name)}</div>
          <div class="event-meta">${esc(ev.venue)} · ${esc(ev.date)} ${esc(ev.time)} · radius ${ev.radius}m</div>
        </button>
        <span class="event-code">${ev.code}</span>
      </div>
    `).join('') : `<div class="empty">No events yet. Create one below to generate a scannable check-in code.</div>`}

    <div class="panel" style="margin-top:22px;">
      <div class="section-head"><h2>Create an event</h2><span class="hint">STEP 1 OF 1</span></div>
      <form id="create-event-form">
        <div class="field"><label>Event name</label><input required name="name" placeholder="Robotics Club — Weekly Sync" /></div>
        <div class="field-row">
          <div class="field"><label>Organizer</label><input required name="org" placeholder="Your name or club" /></div>
          <div class="field"><label>Venue</label><input required name="venue" placeholder="Room 204, Main Block" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Date</label><input required type="date" name="date" /></div>
          <div class="field"><label>Time</label><input required type="time" name="time" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Check-in radius (meters)</label><input required type="number" min="10" max="2000" name="radius" value="100" /></div>
          <div class="field"><label>Venue coordinates</label>
            <div style="display:flex;gap:8px;">
              <input name="latlng" id="latlng-display" placeholder="Latitude, Longitude" />
              <button type="button" class="btn btn-sm" id="use-location-btn">${ICON.pin} Use here</button>
            </div>
            <div class="field-sub" id="latlng-hint">Stand at the venue and tap "Use here" to capture its coordinates.</div>
          </div>
        </div>
        <input type="hidden" name="lat" id="lat-input" />
        <input type="hidden" name="lng" id="lng-input" />
        <button class="btn btn-primary btn-block" type="submit">${ICON.plus} Create event &amp; generate QR</button>
      </form>
    </div>
  `;
}

function renderEventDashboard(ev){
  const total = state.attendance.length;
  const verified = state.attendance.filter(r=>r.status==='verified');
  const rejected = state.attendance.filter(r=>r.status==='rejected');
  const unique = new Set(verified.map(r=>r.studentId.toLowerCase())).size;
  const avgDist = verified.length ? Math.round(verified.reduce((s,r)=>s+r.distance,0)/verified.length) : 0;
  const last = state.attendance[state.attendance.length-1];

  // build 10 buckets over last 30 minutes (or full range if event older)
  const buckets = new Array(10).fill(0);
  if(verified.length){
    const now = Date.now();
    const span = 30*60*1000;
    verified.forEach(r=>{
      const age = now - r.time;
      if(age <= span){
        const idx = Math.min(9, Math.floor((span-age)/(span/10)));
        buckets[idx]++;
      }
    });
  }
  const maxB = Math.max(1, ...buckets);

  const feedItems = [...state.attendance].sort((a,b)=>b.time-a.time).slice(0,10);

  return `
    <button class="btn btn-ghost btn-sm" data-act="back-events" style="margin-bottom:16px;">${ICON.back} All events</button>
    <div class="event-header">
      <div>
        <h1 class="event-title">${esc(ev.name)}</h1>
        <div class="event-sub">${esc(ev.venue)} · ${esc(ev.date)} ${esc(ev.time)} · code <b style="color:var(--amber)">${ev.code}</b> · radius ${ev.radius}m</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm" data-act="export-csv">${ICON.download} Export report</button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat good"><div class="num">${verified.length}</div><div class="lbl">Verified check-ins</div></div>
      <div class="stat accent"><div class="num">${unique}</div><div class="lbl">Unique attendees</div></div>
      <div class="stat"><div class="num">${avgDist}m</div><div class="lbl">Avg. distance to venue</div></div>
      <div class="stat"><div class="num">${last ? timeAgo(last.time) : '—'}</div><div class="lbl">Last activity</div></div>
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="section-head"><h2>Live activity</h2><span class="hint">AUTO-REFRESHES</span></div>
        ${feedItems.length ? feedItems.map(r=>`
          <div class="feed-item">
            <span class="badge ${r.status==='verified'?'ok':'bad'}"></span>
            <div class="feed-main">
              <div class="feed-name">${esc(r.name)} <span style="color:var(--muted-2);font-weight:400;">· ${esc(r.studentId)}</span></div>
              <div class="feed-detail">${r.status==='verified' ? `Verified · ${Math.round(r.distance)}m from venue` : `Rejected · ${Math.round(r.distance)}m away, outside ${ev.radius}m radius`}</div>
            </div>
            <div class="feed-time">${fmtTime(r.time)}</div>
          </div>
        `).join('') : `<div class="empty">No check-ins yet. Share the QR code or the ${ev.code} code with attendees.</div>`}

        <div class="section-head" style="margin-top:22px;"><h2>Check-ins, last 30 min</h2></div>
        <div class="bars">${buckets.map(v=>`<div class="bar" style="height:${Math.max(4,(v/maxB)*100)}%"></div>`).join('')}</div>
        <div class="bars-labels"><span>-30m</span><span></span><span></span><span></span><span>-15m</span><span></span><span></span><span></span><span></span><span>now</span></div>
      </div>

      <div class="panel">
        <div class="section-head"><h2>Scan to check in</h2></div>
        <div class="qr-box">
          <div class="qr-frame" id="qr-canvas-holder"></div>
          <div class="code-big">${ev.code}</div>
          <div class="field-sub" style="text-align:center;">Attendees can scan this or type the code manually in the Attendee tab.</div>
          <button class="btn btn-sm" data-act="download-qr">${ICON.download} Download QR</button>
        </div>
      </div>
    </div>
  `;
}

// ---------------- ATTENDEE ----------------
function renderAttendee(){
  const f = state.attFlow;
  const stepIdx = {code:0, details:1, locating:2, result:2}[f.step] ?? 0;
  return `
  <div class="flow">
    <div class="flow-steps"><span class="${stepIdx>=0?'done':''}"></span><span class="${stepIdx>=1?'done':''}"></span><span class="${stepIdx>=2?'done':''}"></span></div>
    ${f.step==='code' ? renderStepCode(f) : ''}
    ${f.step==='details' ? renderStepDetails(f) : ''}
    ${f.step==='locating' ? renderStepLocating(f) : ''}
    ${f.step==='result' ? renderStepResult(f) : ''}
  </div>
  `;
}

function renderStepCode(f){
  return `
    <div class="panel">
      <div class="section-head"><h2>Enter event code</h2><span class="hint">STEP 1 OF 3</span></div>
      <button class="btn btn-primary btn-block" data-act="open-scanner">${ICON.camera} Scan QR code</button>
      <div class="divider">or type the code</div>
      <form id="code-form">
        <input class="keypad-code" maxlength="6" name="code" placeholder="ABC123" autocomplete="off" />
        ${f.error ? `<div class="field-sub" style="color:var(--coral);text-align:center;margin-top:10px;">${esc(f.error)}</div>` : ''}
        <button class="btn btn-primary btn-block" style="margin-top:14px;" type="submit">Continue ${ICON.arrow}</button>
      </form>
    </div>
  `;
}

function renderStepDetails(f){
  return `
    <div class="panel">
      <div class="section-head"><h2>${esc(f.eventPreview.name)}</h2><span class="hint">STEP 2 OF 3</span></div>
      <div class="field-sub" style="margin-bottom:16px;">${esc(f.eventPreview.venue)} · ${esc(f.eventPreview.date)} ${esc(f.eventPreview.time)}</div>
      <form id="details-form">
        <div class="field"><label>Your name</label><input required name="name" placeholder="Full name" /></div>
        <div class="field"><label>Student / member ID</label><input required name="studentId" placeholder="e.g. 22CS045" /></div>
        <button class="btn btn-primary btn-block" type="submit">${ICON.pin} Verify my location &amp; check in</button>
        <button type="button" class="btn btn-ghost btn-block" style="margin-top:8px;" data-act="attendee-back">${ICON.back} Use a different code</button>
      </form>
    </div>
  `;
}

function renderStepLocating(f){
  return `
    <div class="panel status-hero">
      <div class="spin-ring"></div>
      <h2 style="margin-top:18px;">Confirming your location…</h2>
      <p>Checking that you're within range of ${esc(f.eventPreview.venue)}. Keep location access on.</p>
    </div>
  `;
}

function renderStepResult(f){
  const ok = f.result === 'verified';
  return `
    <div class="panel status-hero">
      <div class="status-icon" style="color:${ok?'var(--green)':'var(--coral)'}">${ok?ICON.check:ICON.x}</div>
      <h2>${ok ? "You're checked in" : "Too far from the venue"}</h2>
      <p>${ok ? `Welcome, ${esc(f.name)}. Your attendance for ${esc(f.eventPreview.name)} is recorded.` : `You're about ${Math.round(f.distance)}m away — you need to be within ${f.eventPreview.radius}m of ${esc(f.eventPreview.venue)} to check in.`}</p>
      <div class="distance-pill">${ICON.pin} ${Math.round(f.distance)}m from venue · limit ${f.eventPreview.radius}m</div>
      <div>
        ${!ok ? `<button class="btn btn-primary btn-block" data-act="retry-location">Try again</button>` : ''}
        <button class="btn ${ok?'btn-ghost':''} btn-block" style="margin-top:8px;" data-act="attendee-reset">Check in to another event</button>
      </div>
    </div>
  `;
}

function renderScanModal(){
  return `
    <div class="scan-modal">
      <div class="scan-card">
        <div class="section-head"><h2>Point at the QR code</h2><button class="btn btn-ghost btn-sm" data-act="close-scanner">${ICON.x} Close</button></div>
        <div class="scan-video-wrap">
          <video id="scan-video" playsinline muted></video>
          <div class="scan-frame"></div>
        </div>
        <div class="scan-hint" id="scan-status">Requesting camera access…</div>
      </div>
    </div>
  `;
}

// ---------------- camera / QR scanning ----------------
let mediaStream = null;
function startCamera(){
  const video = document.getElementById('scan-video');
  const statusEl = document.getElementById('scan-status');
  if(!video) return;
  navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream=>{
      mediaStream = stream;
      video.srcObject = stream;
      video.play();
      if(statusEl) statusEl.textContent = 'Scanning…';
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      function tick(){
        if(!state.scanning) return;
        if(video.readyState === video.HAVE_ENOUGH_DATA){
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          const img = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = window.jsQR ? window.jsQR(img.data, img.width, img.height) : null;
          if(code && code.data){
            let val = code.data.trim();
            if(val.startsWith(APP_PREFIX)) val = val.slice(APP_PREFIX.length);
            stopCamera();
            state.scanning = false;
            handleCodeSubmit(val);
            return;
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })
    .catch(()=>{
      if(statusEl) statusEl.textContent = "Couldn't access the camera — close this and type the code instead.";
    });
}
function stopCamera(){
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream = null; }
}

// ---------------- event wiring ----------------
function wireEvents(){
  document.querySelectorAll('[data-act="role"]').forEach(b=>{
    b.onclick = ()=>{ state.role = b.dataset.role; state.selectedEventId=null; stopPoll();
      if(state.role==='organizer') loadEventsIndex().then(render);
      else render();
    };
  });

  const createForm = document.getElementById('create-event-form');
  if(createForm){
    const latInput = document.getElementById('lat-input');
    const lngInput = document.getElementById('lng-input');
    const latlngDisplay = document.getElementById('latlng-display');
    const hint = document.getElementById('latlng-hint');
    const useBtn = document.getElementById('use-location-btn');
    if(useBtn){
      useBtn.onclick = ()=>{
        hint.textContent = 'Locating…';
        if(!navigator.geolocation){
          hint.textContent = 'Geolocation is not supported. Enter coordinates manually.';
          return;
        }
        navigator.geolocation.getCurrentPosition(pos=>{
          latInput.value = pos.coords.latitude;
          lngInput.value = pos.coords.longitude;
          latlngDisplay.value = pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6);
          hint.textContent = 'Coordinates captured successfully.';
        }, error=>{
          console.error('Geolocation error:', error);
          hint.textContent = 'Could not get location. Enter Latitude, Longitude manually.';
        }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
      };
    }
    createForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(createForm);

      let lat = fd.get('lat');
      let lng = fd.get('lng');

      // If GPS did not work, allow manual "latitude, longitude" entry.
      if(!lat || !lng){
        const coords = (fd.get('latlng') || '').trim();
        if(coords.includes(',')){
          const parts = coords.split(',');
          const manualLat = parseFloat(parts[0].trim());
          const manualLng = parseFloat(parts[1].trim());
          if(!Number.isNaN(manualLat) && !Number.isNaN(manualLng)){
            lat = manualLat;
            lng = manualLng;
            latInput.value = manualLat;
            lngInput.value = manualLng;
          }
        }
      }

      if(lat === '' || lng === '' || lat == null || lng == null ||
         Number.isNaN(parseFloat(lat)) || Number.isNaN(parseFloat(lng))){
        showToast('Enter valid venue coordinates.');
        return;
      }

      const ev = await createEvent({
        name: fd.get('name'), org: fd.get('org'), venue: fd.get('venue'),
        date: fd.get('date'), time: fd.get('time'),
        lat: parseFloat(lat), lng: parseFloat(lng),
        radius: parseInt(fd.get('radius'),10) || 100,
      });
      state.selectedEventId = ev.id;
      await loadAttendance(ev.id);
      render();
      startPoll();
      showToast('Event created — QR code ready to share.');
    };
  }

  document.querySelectorAll('[data-act="open-event"]').forEach(b=>{
    b.onclick = async ()=>{
      state.selectedEventId = b.dataset.id;
      await loadAttendance(state.selectedEventId);
      render();
      startPoll();
    };
  });
  const backBtn = document.querySelector('[data-act="back-events"]');
  if(backBtn) backBtn.onclick = ()=>{ state.selectedEventId=null; stopPoll(); render(); };

  const exportBtn = document.querySelector('[data-act="export-csv"]');
  if(exportBtn) exportBtn.onclick = ()=> exportCSV();

  const dlQr = document.querySelector('[data-act="download-qr"]');
  if(dlQr) dlQr.onclick = ()=> downloadQR();

  // render QR into holder if present
  const qrHolder = document.getElementById('qr-canvas-holder');
  if(qrHolder){
    qrHolder.innerHTML = '';
    const ev = state.events.find(e=>e.id===state.selectedEventId);
    if(ev && window.QRCode){
      new QRCode(qrHolder, {
        text: APP_PREFIX + ev.code,
        width: 180,
        height: 180,
        colorDark: '#0E1228',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } else if(ev && !window.QRCode){
      qrHolder.innerHTML = '<div style="padding:16px;text-align:center;color:#8f9ac2">QR library could not load. Check your internet connection and refresh.</div>';
    }
  }

  // attendee flow
  const codeForm = document.getElementById('code-form');
  if(codeForm) codeForm.onsubmit = (e)=>{ e.preventDefault(); handleCodeSubmit(new FormData(codeForm).get('code')); };

  const openScanner = document.querySelector('[data-act="open-scanner"]');
  if(openScanner) openScanner.onclick = ()=>{ state.scanning = true; render(); };
  const closeScanner = document.querySelector('[data-act="close-scanner"]');
  if(closeScanner) closeScanner.onclick = ()=>{ stopCamera(); state.scanning = false; render(); };

  const detailsForm = document.getElementById('details-form');
  if(detailsForm) detailsForm.onsubmit = (e)=>{ e.preventDefault(); const fd = new FormData(detailsForm); handleDetailsSubmit(fd.get('name'), fd.get('studentId')); };

  const attBack = document.querySelector('[data-act="attendee-back"]');
  if(attBack) attBack.onclick = ()=>{ state.attFlow = {step:'code', code:'', eventPreview:null, name:'', studentId:'', error:''}; render(); };
  const attReset = document.querySelector('[data-act="attendee-reset"]');
  if(attReset) attReset.onclick = ()=>{ state.attFlow = {step:'code', code:'', eventPreview:null, name:'', studentId:'', error:''}; render(); };
  const retryLoc = document.querySelector('[data-act="retry-location"]');
  if(retryLoc) retryLoc.onclick = ()=> verifyLocation();
}

async function handleCodeSubmit(rawCode){
  const code = (rawCode||'').trim().toUpperCase();
  if(!code){ state.attFlow.error = 'Enter a code.'; render(); return; }
  const ev = await findEventByCode(code);
  if(!ev){ state.attFlow = {...state.attFlow, error: "That code doesn't match an active event."}; render(); return; }
  state.attFlow = { step:'details', code, eventPreview: ev, name:'', studentId:'', error:'' };
  render();
}

function handleDetailsSubmit(name, studentId){
  state.attFlow.name = name;
  state.attFlow.studentId = studentId;
  state.attFlow.step = 'locating';
  render();
  verifyLocation();
}

function verifyLocation(){
  state.attFlow.step = 'locating';
  render();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const f = state.attFlow;
    const ev = f.eventPreview;
    const dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, ev.lat, ev.lng);
    const status = dist <= ev.radius ? 'verified' : 'rejected';
    await addAttendanceRecord(ev.id, {
      name: f.name, studentId: f.studentId, time: Date.now(),
      distance: dist, status, lat: pos.coords.latitude, lng: pos.coords.longitude,
    });
    state.attFlow.step = 'result';
    state.attFlow.result = status;
    state.attFlow.distance = dist;
    render();
  }, ()=>{
    state.attFlow.step = 'result';
    state.attFlow.result = 'rejected';
    state.attFlow.distance = 999999;
    showToast('Location access is required to check in.');
    render();
  }, {enableHighAccuracy:true, timeout:12000});
}

function downloadQR(){
  const holder = document.getElementById('qr-canvas-holder');
  const img = holder?.querySelector('img');
  const canvas = holder?.querySelector('canvas');
  const ev = state.events.find(e=>e.id===state.selectedEventId);
  const a = document.createElement('a');
  a.download = (ev?ev.code:'checkpoint')+'-qr.png';
  if(canvas){ a.href = canvas.toDataURL('image/png'); }
  else if(img){ a.href = img.src; }
  else { showToast('QR not ready yet.'); return; }
  a.click();
}

function exportCSV(){
  const ev = state.events.find(e=>e.id===state.selectedEventId);
  if(!ev) return;
  const rows = [['Name','Member ID','Status','Distance (m)','Timestamp','Latitude','Longitude']];
  [...state.attendance].sort((a,b)=>a.time-b.time).forEach(r=>{
    rows.push([r.name, r.studentId, r.status, Math.round(r.distance), new Date(r.time).toISOString(), r.lat, r.lng]);
  });
  const csv = rows.map(row=>row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${ev.name.replace(/[^a-z0-9]+/gi,'-')}-attendance.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Report downloaded.');
}

function startPoll(){
  stopPoll();
  pollTimer = setInterval(async ()=>{
    if(!state.selectedEventId || state.role!=='organizer') return;
    await loadAttendance(state.selectedEventId);
    // re-render only the main area content if still on same screen
    if(state.selectedEventId){
      const mainEl = document.querySelector('.main');
      if(mainEl){
        const ev = state.events.find(e=>e.id===state.selectedEventId);
        if(ev) mainEl.innerHTML = renderEventDashboard(ev);
        wireEvents();
      }
    }
  }, 4000);
}
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

// ---------------- boot ----------------
render();
</script>
</body>
